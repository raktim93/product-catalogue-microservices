# PostgreSQL for catalogue-service. Stage 8: part of whole-system.compose.yaml in product-catalogue
# (docker compose up -d postgres); still runs on its own with -f catalogue-service/postgres.compose.yaml
services:
  postgres:
    image: postgres:18.7
    container_name: catalogue-postgres
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue                 # used once, when the volume is created (development only)
    ports:
      - "25432:5432"                               # host:container (25432 on your PC, 5432 inside the network)
    volumes:
      - catalogue-pgdata:/var/lib/postgresql       # PostgreSQL 18+ images: mount here, not .../data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  catalogue-pgdata:
    name: catalogue-service_catalogue-pgdata       # Stage 8: the name it got in Stages 2-7, so the data stays