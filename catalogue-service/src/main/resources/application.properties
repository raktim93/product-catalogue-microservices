spring.application.name=catalogue-service
server.port=8081

# --- Database: H2 in memory by default; the postgres profile switches to PostgreSQL (CP 2.7) ---
spring.datasource.url=jdbc:h2:mem:catalogue;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# Flyway creates and changes the schema; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Close the database session when the service returns, not after the response is written
spring.jpa.open-in-view=false

# --- Paging: the largest page a client may ask for ---
spring.data.web.pageable.max-page-size=50

# --- Learning: every SQL statement with its values, and when transactions start, commit and roll back (CP 2.5) ---
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.springframework.orm.jpa.JpaTransactionManager=debug

# Every log line becomes: INFO [the-request-id] 25896 --- [catalogue-service] ...
logging.pattern.level=%5p [%X{requestId:-}]

# --- Actuator (DEV ONLY exposure) ---
management.endpoints.web.exposure.include=health,info,beans,conditions,configprops,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always

# --- Kafka (CAT-61; Stage 8: the address from the environment) ---
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
catalogue.events.topic=product-events
# Give up within 5-10 s when Kafka is down, instead of waiting up to 2 minutes
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# --- Outbox (CAT-62) ---
# How often OutboxPublisher looks for unsent events, in milliseconds
catalogue.outbox.poll-ms=1000