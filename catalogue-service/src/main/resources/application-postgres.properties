# Activated with --spring.profiles.active=postgres (in Docker: SPRING_PROFILES_ACTIVE=postgres)
# Stage 8: every value from the environment. Address and user fall back to your PC's PostgreSQL;
# the password has no fallback, so it never sits in Git and a missing one stops the start.
#   Git Bash, once per window, from product-catalogue:  set -a && source .env && set +a
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:25432/catalogue}
spring.datasource.username=${DB_USERNAME:catalogue}
spring.datasource.password=${DB_PASSWORD}