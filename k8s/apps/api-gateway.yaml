# CAT-74: the gateway. The one way in: Postman's {{gatewayUrl}} (http://localhost:8080) works unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: product-catalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: product-catalogue/api-gateway:stage-9
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: product-catalogue-config   # CATALOGUE_URL and SEARCH_URL: the two routes (the rest unused)
          startupProbe:                       # Spring Boot adds /liveness and /readiness by itself on Kubernetes
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: product-catalogue
spec:
  type: LoadBalancer                          # Docker Desktop opens it on localhost:8080
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
