# CAT-73: one Kafka broker (KRaft, no ZooKeeper), as in kafka.compose.yaml. Only pods use it, so one client listener.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: product-catalogue
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false               # else Kubernetes adds KAFKA_PORT=tcp://..., which the image reads as a setting
      initContainers:
        - name: fix-permissions               # runs as root, once, before Kafka: Kafka runs as appuser (uid 1000)
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: apache/kafka:4.4.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller        # one process does both jobs (development only)
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092    # the Service name: what clients are told to connect to
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093         # itself; not through the Service, which waits for this pod to be Ready
            - name: CLUSTER_ID
              value: 4L6g3nShT-eMCtK--X86sw    # the same fixed id as Compose
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"                  # catalogue creates product-events on purpose (KafkaTopicConfig)
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data      # on the PVC: topics and offsets survive a new pod
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m        # the image's default is 1 GB, the whole limit
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
          resources:
            requests:
              memory: 768Mi
              cpu: 250m
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:                       # the PVC data-kafka-0
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: product-catalogue
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
