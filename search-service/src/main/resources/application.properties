spring.application.name=search-service
server.port=8082

# --- catalogue client: used only by the reload ---
# CAT-76: a plain URL. localhost on your PC; the container name in Compose, the Service name in Kubernetes
catalogue.client.base-url=${CATALOGUE_URL:http://localhost:8081}
catalogue.client.connect-timeout=1s
catalogue.client.read-timeout=2s
catalogue.client.page-size=50

spring.mvc.problemdetails.enabled=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,reload
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# Ready only once the index answers and the startup reload is done (CAT-74: Kubernetes asks this)
management.endpoint.health.group.readiness.include=readinessState,productStore

logging.pattern.level=%5p [%X{requestId:-}]

# --- Kafka (CAT-61; Stage 8: the address from the environment) ---
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
search.events.topic=product-events
# CAT-72: the name the old engine switch produced, written out, so search keeps its place in the topic
spring.kafka.consumer.group-id=search-elasticsearch
spring.kafka.consumer.auto-offset-reset=earliest

# --- Elasticsearch (CAT-68; Stage 8: the address from the environment) ---
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}
spring.elasticsearch.connection-timeout=1s
spring.elasticsearch.socket-timeout=5s